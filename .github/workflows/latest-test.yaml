name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install uv==0.12.5
      - name: Check dependency locks
        run: |
          uv pip compile --python-version 3.12 --universal requirements.txt -o requirements.lock.txt
          uv pip compile --python-version 3.12 --universal -c requirements.lock.txt requirements-test.txt -o requirements-test.lock.txt
          git diff --exit-code -- requirements.lock.txt requirements-test.lock.txt
      - run: pip install -r requirements.lock.txt -r requirements-test.lock.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test e2e/setup-storage.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run mocked browser regressions
        run: |
          npm run dev -- --host 0.0.0.0 > "$RUNNER_TEMP/linguard-vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then cat "$RUNNER_TEMP/linguard-vite.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ > /dev/null
          npx playwright test e2e/setup-secrets.spec.ts e2e/setup-lifecycle.spec.ts e2e/dashboard-live-pagination.spec.ts e2e/integration-script-unsupported.spec.ts e2e/auth-regressions.spec.ts e2e/websocket-ticket.spec.ts e2e/oidc-link.spec.ts e2e/setup-resume-server.spec.ts e2e/peers-pagination.spec.ts e2e/notification-center-live.spec.ts e2e/logs-security.spec.ts
