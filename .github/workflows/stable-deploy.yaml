name: Publish Stable Image
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check tested commit is still current
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale CI run."
          fi
      - name: Determine release version
        id: version
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("version.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf 'Invalid release version: %s\n' "$version"; exit 1; }
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag" && [ "$(git rev-parse "$tag^{}")" != "$(git rev-parse HEAD)" ]; then
            echo "Release $tag already points to another commit; publishing moving tags only."
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        if: steps.current.outputs.publish == 'true'
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=stable
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.publish_release }}
      - uses: docker/setup-qemu-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.current.outputs.publish == 'true'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create release if absent
        if: steps.version.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export VERSION_TAG="v$VERSION"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == env.VERSION_TAG) | .tag_name')
          if [ -n "$existing" ]; then
            echo "Release $VERSION_TAG already exists."
          else
            gh release create "$VERSION_TAG" --target "${{ github.event.workflow_run.head_sha }}" --title "$VERSION_TAG" --generate-notes
          fi
