services:
  linguard:
    image: linguard:${VERSION:-latest}
    container_name: linguard
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "51820:51820/udp"
    volumes:
      - /etc/wireguard:/etc/wireguard:rw
      - linguard_data:/app/data
      - linguard_backups:/app/backend/backups
      - linguard_plugins:/app/backend/plugins
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - seccomp:unconfined
    privileged: true

volumes:
  linguard_data:
  linguard_backups:
  linguard_plugins:
