version: '3.8'

services:
  linguard:
    image: linguard:${VERSION:-latest}
    container_name: linguard
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "51820:51820/udp"
    volumes:
      - /etc/wireguard:/etc/wireguard:rw
      - linguard_data:/app/data
      - linguard_backups:/app/backups
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/data/linguard.db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - USE_OIDC=${USE_OIDC:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - seccomp:unconfined
    privileged: true

volumes:
  linguard_data:
  linguard_backups:
