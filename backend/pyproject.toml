[tool.ruff]
# Target Python 3.11+
target-version = "py311"

# Line length
line-length = 120

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",
    "*.egg-info",
]

# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends pattern)
    "N805",  # First argument of method should be named `self` (Pydantic validators)
]

[tool.ruff.per-file-ignores]
# Ignore unused imports in __init__.py files
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["app"]

# Pytest and coverage settings
[tool.pytest.ini_options]
coverage = true
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "app",
    "src/linguard_cli",
]
# The FastAPI app runs inside Starlette's TestClient portal thread, and
# SQLAlchemy's async engine switches into greenlets. Without both concurrency
# modes, every statement after an ``await db.execute(...)`` is reported as
# uncovered even though the tests execute it.
concurrency = ["thread", "greenlet"]
omit = [
    "*/src/linguard_cli/test_*.py",
    "*/src/linguard_cli/setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == __main__:",
]
