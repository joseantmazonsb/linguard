[pytest]
# Test configuration for Linguard
# Goal: 100% test coverage on all implemented features

# Add pytest-asyncio plugin
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Markers for test organization
markers =
    authentication: Tests for authentication functionality
    security: Tests for security features
    ipv4: Tests for IPv4 functionality
    ipv6: Tests for IPv6 functionality
    wireguard: Tests for WireGuard core functionality
    websocket: Tests for WebSocket functionality
    dns: Tests for DNS configuration
    backup: Tests for backup functionality
    plugin: Tests for plugin system
    firewall: Tests for firewall functionality
    monitoring: Tests for monitoring services
    migration: Tests for migration functionality
    api: Tests for API endpoints
    database: Tests for database operations
    validation: Tests for validation and schemas
    integration: Integration tests
    unit: Unit tests
    e2e: End-to-end tests
    asyncio: Tests that use asyncio
    event_loop: Tests that use pytest-asyncio's default event_loop fixture

# Coverage settings
addopts = 
    --cov=app,src/linguard_cli
    --cov-report=html:coverage_report
    --cov-report=xml:coverage.xml
    --cov-fail-under=0
    --strict-markers
    --tb=short
    --ignore=tests/test_audit_logger.py

# This sandbox has no iptables; unit tests that instantiate WireGuard/Firewall
# services directly (outside the app via TestClient) need the dummy driver.
env =
    DEBUG_BYPASS_FIREWALL=true

# Asyncio settings
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_mode_for_tests = auto

# Per-test timeout. TestClient ignores httpx timeouts, so a test that reads an
# infinite SSE stream (e.g. GET /api/v1/logs/stream) would hang forever and
# block every test after it; pytest-timeout turns those hangs into failures.
# Signal method (the Unix default) raises in the main thread so the run
# continues past the hung test instead of killing the whole process.
timeout = 30
timeout_method = signal

# Coverage settings: the ASGI app runs inside a separate thread spawned by
# Starlette's TestClient (portal). Without thread concurrency coverage only
# records the main thread, so every endpoint body looks "missing".
[coverage:run]
concurrency = thread
